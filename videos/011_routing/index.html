<!doctype html>
<!--
  Routing, built on the Brad & Prad kit and the shared Reel kit in reel/. One continuous
  Three.js world, with every frame computed from time alone. build_timeline.py writes
  timeline.js, and index.html from this template, with the times measured from the take.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Routing</title>
    <link rel="stylesheet" href="brand/brand.css" />
    <script src="brand/vendor/gsap.min.js"></script>
    <script src="brand/stickman/stickman.js"></script>
    <script src="brand/brand-kit.js"></script>
    <script src="timeline.js"></script>
    <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
    <style>
      #root { position: absolute; inset: 0; overflow: hidden; }
      #world, #figures, #labels { position: absolute; inset: 0; }
      #world canvas { display: block; }
      #labels > * { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform; }
      .line { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 84px; line-height: 1.04; opacity: 0; }
      .line.big { font-size: 112px; }

      .card { width: 150px; height: 124px; margin-left: -75px; margin-top: -62px; background: var(--brand-background); border: 5px solid var(--brand-ink); border-radius: 14px; box-sizing: border-box; }
      .card .icon { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; }
      .card .tag { position: absolute; left: 50%; bottom: 130px; padding: 2px 16px 6px; background: var(--brand-ink); color: var(--brand-background); border-radius: 10px; font-size: 40px; line-height: 46px; white-space: nowrap; transform-origin: 50% 100%; opacity: 0; }
      .card .tag.wrong { background: var(--brand-accent); }
      .card .badge { position: absolute; right: -40px; bottom: -40px; width: 76px; height: 76px; opacity: 0; }

      .anchor { width: 0; height: 0; transform-origin: 0 0; }
      .sign { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); padding: 4px 26px 10px; background: var(--brand-background); border: 5px solid var(--brand-ink); border-radius: 10px; font-size: 60px; line-height: 66px; white-space: nowrap; }
      #reject { width: 150px; height: 150px; margin-left: -75px; margin-top: -75px; }

      #rights { position: absolute; top: 0; left: 0; right: 0; opacity: 0; }
      .right-row { display: flex; align-items: center; justify-content: center; gap: 22px; height: 84px; font-size: 72px; line-height: 1; opacity: 0; }
      .right-row svg { width: 64px; height: 64px; flex: none; }

      #end-title { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 168px; line-height: 1; }
      #end-handle { position: absolute; top: 372px; left: 0; right: 0; text-align: center; }
      #end-logo-slot { position: absolute; top: 470px; left: 50%; width: 280px; height: 280px; margin-left: -140px; }
      #end-stage svg { position: absolute; inset: 0; overflow: visible; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="i-check" viewBox="0 0 64 64"><path d="M14 33 L27 46 L51 19" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-cross" viewBox="0 0 64 64"><path d="M17 17 L47 47 M47 17 L17 47" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" /></symbol>
        <symbol id="i-badge-check" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#E8401A" stroke="#141210" stroke-width="4" /><path d="M18 33 L28 43 L47 22" fill="none" stroke="#E8E0D8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-badge-cross" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#E8E0D8" stroke="#E8401A" stroke-width="5" /><path d="M21 21 L43 43 M43 21 L21 43" fill="none" stroke="#E8401A" stroke-width="8" stroke-linecap="round" /></symbol>
        <symbol id="i-calendar" viewBox="0 0 64 64">
          <rect x="8" y="12" width="48" height="44" rx="5" fill="#E8E0D8" stroke="#141210" stroke-width="4" />
          <path d="M8 17 Q8 12 13 12 L51 12 Q56 12 56 17 L56 25 L8 25 Z" fill="#E8401A" stroke="#141210" stroke-width="4" stroke-linejoin="round" />
          <path d="M20 6 L20 17 M44 6 L44 17" stroke="#141210" stroke-width="5" stroke-linecap="round" />
          <g fill="#141210"><rect x="15" y="31" width="7" height="6" /><rect x="28.5" y="31" width="7" height="6" /><rect x="42" y="31" width="7" height="6" /><rect x="15" y="43" width="7" height="6" /><rect x="28.5" y="43" width="7" height="6" /></g>
          <rect x="40" y="41" width="11" height="10" rx="2" fill="#E8401A" stroke="#141210" stroke-width="2.5" />
        </symbol>
        <symbol id="i-receipt" viewBox="0 0 64 64">
          <path d="M13 5 L51 5 L51 59 L45 54 L38.7 59 L32 54 L25.3 59 L19 54 L13 59 Z" fill="#E8E0D8" stroke="#141210" stroke-width="4" stroke-linejoin="round" />
          <path d="M20 15 L44 15 M20 24 L44 24 M20 33 L32 33" stroke="#141210" stroke-width="4" stroke-linecap="round" />
          <circle cx="39" cy="42" r="10" fill="#E8401A" stroke="#141210" stroke-width="3" />
          <path d="M43 37.6 C41.5 36 36 35.8 35.6 39 C35.2 42 42.8 41.6 42.6 45 C42.4 48.2 36.6 48 35 46.4 M39 33.8 L39 50.2" fill="none" stroke="#E8E0D8" stroke-width="2.6" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32.861" data-width="1080" data-height="1920" data-fps="60">
      <div id="paper" class="clip" data-start="0" data-duration="32.861" data-track-index="0">
        <div class="paper-sheet bp-paper is-quiet"></div>
        <div class="paper-sheet bp-paper"></div>
        <div class="paper-sheet bp-paper is-folded"></div>
      </div>

      <div id="scene" class="clip" data-start="0" data-duration="30.861" data-track-index="1">
        <div id="world"></div>
        <svg id="figures" viewBox="0 0 1080 1920" width="1080" height="1920" style="overflow: visible; pointer-events: none"></svg>
        <div id="labels" data-layout-allow-overflow data-layout-allow-overlap>
          <div id="sign-scheduling" class="anchor"><div class="sign bp-headline">Scheduling</div></div>
          <div id="sign-billing" class="anchor"><div class="sign bp-headline">Billing</div></div>
          <svg id="reject" viewBox="0 0 64 64"><use href="#i-badge-cross" /></svg>
        </div>

        <div class="bp-safe">
          <div id="line-hook" class="line bp-headline">Calling a hospital's<br /><span class="bp-accent">AI</span> assistant?</div>
          <div id="line-same" class="line bp-headline">Same process<br />for <span class="bp-accent">both?</span></div>
          <div id="line-named" class="line big bp-headline">That's <span class="bp-accent">Routing</span></div>
          <div id="rights">
            <div id="right-0" class="right-row bp-headline"><svg style="color: var(--brand-accent)"><use href="#i-check" /></svg><span>Right <span class="bp-accent">request</span></span></div>
            <div id="right-1" class="right-row bp-headline"><svg style="color: var(--brand-accent)"><use href="#i-check" /></svg><span>Right <span class="bp-accent">workflow</span></span></div>
            <div id="right-2" class="right-row bp-headline"><svg style="color: var(--brand-accent)"><use href="#i-check" /></svg><span>Right <span class="bp-accent">specialist</span></span></div>
          </div>
          <div id="line-wrong" class="line big bp-headline">Wrong <span class="bp-accent">path!</span></div>
          <div id="line-next" class="line big bp-headline">Next caller,<br /><span class="bp-accent">please!</span></div>
        </div>
      </div>

      <div id="end-card" class="clip" data-start="30.661" data-duration="2.2" data-track-index="2">
        <div class="bp-safe">
          <div id="end-title" class="bp-headline bp-accent">Follow for more</div>
          <div id="end-handle" class="bp-caption">@BradAndPrad</div>
          <div id="end-logo-slot"></div>
        </div>
        <div id="end-stage"></div>
      </div>

      <div id="sheet-top" class="clip bp-torn-top" data-start="0" data-duration="1.3" data-track-index="3"></div>
      <div id="sheet-bottom" class="clip bp-torn-bottom" data-start="0" data-duration="1.3" data-track-index="4"></div>
    </div>

    <script type="module">
      import { timeline } from "./source/main.js";
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = timeline;
    </script>
  </body>
</html>
